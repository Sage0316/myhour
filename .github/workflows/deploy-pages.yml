name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch CI run ID containing the hakku-dist artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # CI는 pull_request에서도 도는데 그 실행은 hakku-dist가 아니라 hakku-preview-<n>을 올린다.
    # 성공 여부만 보면 PR CI가 끝날 때마다 배포가 떠서 아티팩트를 못 찾고 실패하므로,
    # main에 push된 CI 실행에서만 배포한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate run ID
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
      - name: Download immutable verified build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name hakku-dist --dir release-dist
      - name: Verify SHA-256 manifest
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS
      - name: Require worker URLs in the build
        # repo vars(VITE_*)가 비면 AI·푸시·BGM이 꺼진 앱이 만들어진다.
        # 그런 빌드가 라이브를 조용히 덮어쓰지 않도록 여기서 배포를 실패시킨다.
        run: grep -rq "workers.dev" release-dist/assets
      - uses: actions/upload-pages-artifact@v4
        with:
          path: release-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

