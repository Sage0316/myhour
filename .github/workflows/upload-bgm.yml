name: Upload BGM to R2

# 새 BGM을 R2(myhour-media)에 올린다. 곡 목록은 myhour/media-server/bgm-sources.json.
# 출처 저장소의 고정 커밋에서 받아 sha256이 맞을 때만 올린다 — 하나라도 다르면 아무것도 올리지 않는다.
# 이미 있는 이름은 같은 파일로 덮어쓰므로 여러 번 눌러도 안전하다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-bgm
  cancel-in-progress: false

jobs:
  upload:
    environment: workers-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and verify tracks
        working-directory: myhour/media-server
        run: |
          set -euo pipefail
          mkdir -p bgm-upload
          repo=$(jq -r .repo bgm-sources.json)
          commit=$(jq -r .commit bgm-sources.json)
          jq -c '.files[]' bgm-sources.json | while read -r entry; do
            key=$(jq -r .key <<<"$entry")
            source=$(jq -r .source <<<"$entry")
            expected=$(jq -r .sha256 <<<"$entry")
            encoded=$(jq -rn --arg s "$source" '$s | split("/") | map(@uri) | join("/")')
            curl -fsSL --retry 3 -o "bgm-upload/$key" "https://raw.githubusercontent.com/$repo/$commit/$encoded"
            actual=$(sha256sum "bgm-upload/$key" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::error::$key sha256 mismatch ($actual)"
              exit 1
            fi
            echo "verified $key"
          done
      - name: Upload to R2
        working-directory: myhour/media-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for file in bgm-upload/*.mp3; do
            key=$(basename "$file")
            pnpm dlx wrangler@4.36.0 r2 object put "myhour-media/$key" --file "$file" --content-type audio/mpeg --remote
          done
