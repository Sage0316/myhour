name: Roll back Worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Production Worker to roll back
        required: true
        type: choice
        options:
          - ai
          - push
      version_id:
        description: Exact previously verified Cloudflare Worker version ID
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK to confirm immediate production replacement
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-${{ inputs.worker }}-production
  cancel-in-progress: false

jobs:
  rollback:
    if: inputs.confirmation == 'ROLLBACK'
    environment: workers-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Roll back exact Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version_id }}
          WORKER: ${{ inputs.worker }}
        run: |
          if [ "$WORKER" = "ai" ]; then
            cd myhour/ai-server
          else
            cd myhour/push-server
          fi
          pnpm dlx wrangler@4.36.0 rollback "$VERSION_ID" --message "GitHub Actions rollback to $VERSION_ID"
