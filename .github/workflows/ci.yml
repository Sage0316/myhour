name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myhour
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: myhour/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
        env:
          VITE_AI_WORKER_URL: ${{ vars.VITE_AI_WORKER_URL }}
          VITE_PUSH_SERVER_URL: ${{ vars.VITE_PUSH_SERVER_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - name: Write artifact digests
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload pull-request preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hakku-preview-${{ github.event.number }}
          path: myhour/dist
          if-no-files-found: error
          retention-days: 14
      - name: Upload rollback artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: hakku-dist
          path: myhour/dist
          if-no-files-found: error
          retention-days: 30
