name: Deploy Workers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Worker environment
        required: true
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: workers-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: workers-${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy AI Worker
        working-directory: myhour/ai-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [ "$TARGET_ENV" = "preview" ]; then
            pnpm dlx wrangler@4.36.0 deploy --env preview
          else
            pnpm dlx wrangler@4.36.0 deploy
          fi
      - name: Deploy Push Worker
        working-directory: myhour/push-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [ "$TARGET_ENV" = "preview" ]; then
            pnpm dlx wrangler@4.36.0 deploy --env preview
          else
            pnpm dlx wrangler@4.36.0 deploy
          fi
