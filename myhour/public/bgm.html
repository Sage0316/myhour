<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하꾸 BGM 시청</title>
<style>
  body { margin: 0; padding: 24px 18px 60px; background: #FAF9F7; color: #1A1A1A; font-family: -apple-system, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: rgba(26,26,26,0.45); margin-bottom: 24px; }
  h2 { font-size: 13px; letter-spacing: 1px; color: rgba(26,26,26,0.45); font-family: "Courier New", monospace; margin: 26px 0 10px; text-transform: uppercase; }
  .track { background: #fff; border: 1px solid rgba(26,26,26,0.08); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .name { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  audio { width: 100%; height: 36px; }
</style>
</head>
<body>
<h1>하꾸 BGM 시청</h1>
<div class="sub">무드별 3곡 · 재생을 누른 곡만 지연 로딩해요</div>
<div id="list"></div>
<script>
const MOODS = [
  ['여유로운 재즈 (calm)', ['be-chillin.mp3', 'martini-sunset.mp3', 'flutey-jazz.mp3', 'compy-jazz.mp3', 'bass-meant-jazz.mp3']],
  ['경쾌한 팝·펑크 (bright)', ['city-sunshine.mp3', 'funshine.mp3', 'advertime.mp3', 'motions.mp3', 'still-pickin.mp3', 'funkeriffic.mp3', 'groovin.mp3', 'gotta-keep-on-movin.mp3', 'downtown-boogie.mp3', 'sunny-rasta.mp3', 'hippety-hop.mp3']],
  ['벅찬 시네마틱 (emotional)', ['inspiration.mp3', 'journey-of-hope.mp3', 'finally-see-the-light.mp3', 'connecting-rainbows.mp3']],
  ['잔잔한 피아노 (piano)', ['piano.mp3', 'landras-dream.mp3', 'piano-magic.mp3']],
  ['장난스럽고 귀여운 (ukulele)', ['spring-chicken.mp3', 'llama-in-pajama.mp3', 'my-giant-bunny-friend.mp3', 'le-baguette.mp3', 'the-entertainer.mp3', 'vintage-party.mp3']],
  ['따뜻한 노스탤지어 (nostalgic)', ['nostalgic.mp3', 'travelers-notebook.mp3', 'tournesol.mp3']],
  ['차분한 슬픔·위로 (sad)', ['winter.mp3', 'isolation-waltz.mp3', 'cold-journey.mp3']],
];
// 곡 파일은 R2에 있고 hakku-media 워커가 내보낸다 (앱 배포본에는 없다).
// 이 페이지는 빌드를 타지 않는 정적 HTML이라 Vite 환경 변수를 못 써서 주소를 직접 적는다.
const MEDIA_BASE = 'https://hakku-media.sage0316.workers.dev';
const list = document.getElementById('list');
for (const [mood, files] of MOODS) {
  const h = document.createElement('h2');
  h.textContent = mood;
  list.appendChild(h);
  for (const f of files) {
    const div = document.createElement('div');
    div.className = 'track';
    div.innerHTML = '<div class="name">' + f.replace('.mp3', '') + '</div>' +
      '<audio controls preload="none" src="' + MEDIA_BASE + '/bgm/' + f + '"></audio>';
    list.appendChild(div);
  }
}
// 한 곡 재생하면 다른 곡은 멈추게
document.addEventListener('play', e => {
  document.querySelectorAll('audio').forEach(a => { if (a !== e.target) a.pause(); });
}, true);
</script>
</body>
</html>
