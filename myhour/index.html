<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>하꾸 - 하루 꾸미기</title>
    <meta name="description" content="하루의 순간을 기록하고 나만의 영상으로 꾸며요." />

    <!-- PWA -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#FBF7EC" />

    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 상태 표시줄 칸을 따로 둔다. black-translucent는 앱을 상태 표시줄 밑까지 그리게 해서
         위가 흐릿한 유리 효과에 덮이고, 창 높이가 짧게 잡혀 아래에 빈 띠가 생겼다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="하꾸" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 앱이 하얀 화면으로 죽는 대신 에러를 보여주고 재시도할 수 있게
      function showFatal(msg) {
        var root = document.getElementById('root');
        if (root && root.childElementCount > 0) return; // 앱이 이미 떠 있으면 무시
        document.body.innerHTML =
          '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;padding:30px;text-align:center;font-family:system-ui,sans-serif">' +
          '<div style="font-size:15px;font-weight:600">하꾸를 불러오지 못했어요</div>' +
          '<div style="font-size:12px;color:#888;word-break:break-all;max-width:100%">' + msg + '</div>' +
          '<button onclick="location.reload()" style="height:44px;padding:0 28px;border-radius:50px;background:#1A1A1A;color:#fff;border:none;font-size:14px">다시 시도</button>' +
          '</div>';
      }
      window.addEventListener('error', function (e) {
        var isScript = e.target && e.target.tagName === 'SCRIPT';
        if (!e.message && !isScript) return;
        showFatal(e.message || '스크립트 로드 실패: ' + (e.target.src || ''));
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // iOS 앱(capacitor://) 안에서는 파일이 앱에 들어 있어 서비스워커가 필요 없다
      if ('serviceWorker' in navigator && location.protocol !== 'capacitor:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/myhour/sw.js');
        });
      }
    </script>
  </body>
</html>
